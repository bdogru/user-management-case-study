server {
  listen 80;
  root /usr/share/nginx/html;

  # Same as proxy.conf.json in development: the browser talks to one origin.
  location /api/ {
    proxy_pass http://backend:8080;
    # Keep the browser's host, so the Location header of a created user points back through nginx.
    proxy_set_header Host $http_host;
  }
}
